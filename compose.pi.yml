# Raspberry Pi (arm64) / self-built lite image.
# Builds this checkout (including local changes) without Whisper/PyTorch and
# runs it in normal (non-developer) mode. Transcription goes to a remote API
# such as OpenRouter or Groq. See docs/raspberry_pi.md.
#
#   docker compose -f compose.pi.yml up -d --build
services:
  podly:
    container_name: podly-pure-podcasts
    image: podly-pure-podcasts:pi-lite
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE=python:3.11-slim
        - LITE_BUILD=true
        - USE_GPU=false
        - USE_GPU_NVIDIA=false
        - USE_GPU_AMD=false
    ports:
      # Behind tailscale serve/funnel with PODLY_TRUSTED_PROXY, publish the port
      # only on the host: put PODDY_BIND_ADDRESS=127.0.0.1 into a file named
      # ".env" next to this file (docker compose reads it automatically).
      - "${PODDY_BIND_ADDRESS:-0.0.0.0}:5001:5001"
    volumes:
      - ./src/instance:/app/src/instance
    env_file:
      - ./.env.local
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SERVER_THREADS=${SERVER_THREADS:-2}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: podly-pure-podcasts-network
    # Fixed subnet so the gateway (the peer Podly sees for requests forwarded
    # by tailscale serve/funnel or another proxy on the host) is predictable:
    # set PODLY_TRUSTED_PROXY=172.30.42.1 in .env.local. Change both if the
    # subnet collides with your network.
    ipam:
      config:
        - subnet: 172.30.42.0/24
          gateway: 172.30.42.1
